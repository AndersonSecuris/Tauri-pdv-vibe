[package]
name = "cellmaster-pdv"
version = "1.0.0"
description = "CellMaster PDV & Ordem de Servico"
authors = ["CellMaster Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "cellmaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
